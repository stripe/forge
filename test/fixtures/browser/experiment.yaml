id: examples/browser
version: 0.2.0
dataset:
  path: ./dataset
  id: forge-browser-example
  version: 0.2.0
runtime:
  adapter: docker
  image: { kind: forge }
  platform: native
models: {}
treatments:
  baseline:
    setup: []
matrix:
  cases:
    - cases/examples/greeting.case.yaml
  treatments:
    - baseline
  agents:
    - adapter: claude-code
      provider: anthropic
      model: claude-sonnet-4-6
limits:
  run_timeout_ms: 900000
