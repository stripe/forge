id: examples/codex
version: 0.2.0
dataset:
  path: ../one-shot/dataset
  id: forge-quickstart
  version: 0.2.0
runtime:
  adapter: docker
  image:
    kind: forge
  platform: linux/amd64
  resources:
    memory_bytes: 4294967296
    cpu_count: 2
    process_count: 512
models: {}
treatments:
  baseline:
    setup: []
matrix:
  cases:
    - cases/examples/hello-file.case.yaml
  treatments:
    - baseline
  agents:
    - adapter: codex
      provider: openai
      model: gpt-5.4
  repetitions: 1
  retries: 0
limits:
  run_timeout_ms: 900000
