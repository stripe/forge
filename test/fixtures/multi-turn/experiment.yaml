id: examples/multi-turn
version: 0.1.0
dataset:
  path: ./dataset
  id: forge-multi-turn
  version: 0.1.0
  manifest_sha256: sha256:d8069247b18448807dadb8ca085de4811e192b470fe64e9aa9d3b53252a6d9f1
runtime:
  adapter: docker
  image:
    kind: forge
  platform: linux/amd64
  resources:
    memory_bytes: 4294967296
    cpu_count: 2
    process_count: 512
models:
  role_player:
    provider: anthropic
    model: claude-sonnet-4-6
  judge:
    provider: anthropic
    model: claude-sonnet-4-6
treatments:
  baseline:
    setup: []
matrix:
  cases:
    - cases/examples/release-summary.case.yaml
  treatments:
    - baseline
  agents:
    - adapter: claude-code
      provider: anthropic
      model: claude-sonnet-4-6
  repetitions: 1
  retries: 0
limits:
  run_timeout_ms: 900000
