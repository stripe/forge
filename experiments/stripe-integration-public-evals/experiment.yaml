id: stripe-integration-public-evals/baseline
version: 0.3.0
dataset:
  path: ../../datasets/stripe-integration-public-evals
  id: stripe-integration-public-evals
  version: 0.3.0
runtime:
  adapter: docker
  image:
    kind: forge
  platform: linux/amd64
  resources:
    memory_bytes: 4294967296
    cpu_count: 2
    process_count: 512
treatments:
  baseline:
    setup: []
matrix:
  cases:
    - cases/payments-onetime.case.yaml
  treatments:
    - baseline
  agents:
    - adapter: claude-code
      provider: anthropic
      model: claude-sonnet-4-6
  repetitions: 1
  retries: 0
limits:
  run_timeout_ms: 900000
