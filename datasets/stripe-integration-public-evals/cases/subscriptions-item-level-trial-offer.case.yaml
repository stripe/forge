id: stripe-integration-public-evals/subscriptions-item-level-trial-offer
version: 0.1.0
task: |-
  A customer already pays $40/month for a base subscription and wants a 14-day trial of a $20/month analytics add-on while the base charge continues normally. Use Stripe's current Trial Offer API and transition the add-on automatically after the trial. Build the Node.js/TypeScript integration.
initial_prompt: |-
  A customer already pays $40/month for a base subscription and wants a 14-day trial of a $20/month analytics add-on while the base charge continues normally. Use Stripe's current Trial Offer API and transition the add-on automatically after the trial. Build the Node.js/TypeScript integration.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses the Subscriptions API on version 2026-09-30.endive or later with flexible billing mode.'
    requirement_level: MUST
  - value: 'MUST NOT implement the Trial Offer through Checkout, Payment Links, or Checkout Sessions Elements.'
    requirement_level: MUST
  - value: 'MUST: Creates or selects a Trial Offer with a recurring trial Price and a separate recurring post-trial Price for the analytics add-on.'
    requirement_level: MUST
  - value: 'MUST: Attaches the offer through items[].current_trial.trial_offer on the analytics subscription item.'
    requirement_level: MUST
  - value: 'MUST: Keeps the $40 base item billing normally during the add-on trial.'
    requirement_level: MUST
  - value: 'MUST: Authorizes the tenant and updates only the tenant''s intended subscription item.'
    requirement_level: MUST
  - value: 'MUST: Defines the missing-payment-method end behavior explicitly.'
    requirement_level: MUST
  - value: 'MUST: Defines the post-trial billing-cycle-anchor behavior explicitly.'
    requirement_level: MUST
  - value: 'MUST NOT combine legacy trial_end with the Trial Offer.'
    requirement_level: MUST
  - value: 'MUST NOT use unsupported pause, resume, or in-place duration changes while the Trial Offer is active; follows the documented limits of the selected API surface and version.'
    requirement_level: MUST
  - value: 'MUST: Verifies webhook signatures and durably deduplicates subscription and invoice events for the trial transition.'
    requirement_level: MUST
  - value: 'MUST: Derives add-on access from a fresh read of the item''s current trial or post-trial Price and applicable payment state.'
    requirement_level: MUST
  - value: 'MUST: Uses a stable idempotency key for the subscription-item mutation that attaches the offer.'
    requirement_level: MUST
