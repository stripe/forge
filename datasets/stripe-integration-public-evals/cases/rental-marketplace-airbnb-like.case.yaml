id: stripe-integration-public-evals/rental-marketplace-airbnb-like
version: 0.1.0
task: |-
  I'm building a vacation-rental marketplace. Property owners list homes, travelers book stays, and the platform deducts a 3% service fee from the owner's proceeds on each booking. Owners need basic account management. Recommend the Accounts v2 configuration and implement the single-owner payment and fee flow; do not introduce delayed release unless it is actually required.
initial_prompt: |-
  I'm building a vacation-rental marketplace. Property owners list homes, travelers book stays, and the platform deducts a 3% service fee from the owner's proceeds on each booking. Owners need basic account management. Recommend the Accounts v2 configuration and implement the single-owner payment and fee flow; do not introduce delayed release unless it is actually required.
context: |-
  If asked: each booking has one property owner; proceeds may route immediately at booking time; the 3% is deducted from owner proceeds and is gross platform revenue before processing fees; the platform is merchant of record and owns pricing, refunds, disputes, and losses; owners are recipient-only accounts.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses Stripe embedded onboarding as the default onboarding flow.'
    requirement_level: MUST
  - value: 'MUST: Uses destination charges for a single-recipient booking whose proceeds should route immediately to that recipient.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard as express, fees_collector as application, and losses_collector as application.'
    requirement_level: MUST
  - value: 'MUST: Configures recipient capability at configuration.recipient.capabilities.stripe_balance.stripe_transfers for recipient-only connected accounts.'
    requirement_level: MUST
  - value: 'MUST NOT request Merchant configuration or card_payments for a recipient-only connected account.'
    requirement_level: MUST
  - value: 'MUST NOT require on_behalf_of for the destination charge.'
    requirement_level: MUST
  - value: 'MUST: Sets application_fee_amount to round(charge_amount * 0.03) in minor units.'
    requirement_level: MUST
  - value: 'MUST: States that the 3% is deducted from owner proceeds rather than added to the traveler charge.'
    requirement_level: MUST
  - value: 'MUST: Warns that Stripe processing fees can leave a thin or negative net margin when gross platform revenue is only 3%.'
    requirement_level: MUST
  - value: 'Links to current Stripe pricing or recommends validating the margin with the Platform Pricing Tool.'
    requirement_level: SHOULD
  - value: 'MUST NOT choose separate charges and transfers solely because owners are paid on a payout schedule.'
    requirement_level: MUST
