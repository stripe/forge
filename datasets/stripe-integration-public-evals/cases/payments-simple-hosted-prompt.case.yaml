id: stripe-integration-public-evals/payments-simple-hosted-prompt
version: 0.1.0
task: |-
  I want to build a storefront which sells a single book that uses Stripe for payment processing.
initial_prompt: |-
  I want to build a storefront which sells a single book that uses Stripe for payment processing.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'Uses checkout.sessions.create with mode ''payment'' for the one-time charge'
    requirement_level: SHOULD
  - value: 'MUST NOT use paymentIntents.create directly (Checkout Sessions is the recommended approach for hosted checkout)'
    requirement_level: MUST
  - value: 'MUST: Has success_url configured for the post-payment redirect'
    requirement_level: MUST
  - value: 'MUST: Has cancel_url configured'
    requirement_level: MUST
  - value: 'Has a webhook handler that verifies the payment (constructEvent or similar)'
    requirement_level: SHOULD
  - value: 'MUST NOT pass payment_method_types to any Stripe API call — dynamic payment methods should remain enabled since the prompt does not request specific payment methods. If the code does not include payment_method_types at all, this expectation PASSES regardless of which Stripe API is used.'
    requirement_level: MUST
  - value: 'Configures the Stripe client with apiVersion set to ''2026-04-22.dahlia'' (the latest API version) — either in the Stripe constructor options or equivalent configuration. If no apiVersion is explicitly set anywhere in the code, this expectation PASSES (the SDK defaults to the account''s version). This expectation only FAILS if an older apiVersion is explicitly hardcoded.'
    requirement_level: SHOULD
  - value: 'Includes the parameter integration_identifier in the checkout.sessions.create call'
    requirement_level: SHOULD
