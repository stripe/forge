id: stripe-integration-public-evals/low-margin-marketplace-1pct-emily
version: 0.1.0
task: |-
  I'm building a neighborhood services marketplace for dog walking, babysitting, and knife sharpening. Each booking has one neighbor provider, users are not technical, and the platform keeps exactly 1% on top of Stripe processing fees. Recommend the Accounts v2 setup and implement the immediate-routing destination-charge formula.
initial_prompt: |-
  I'm building a neighborhood services marketplace for dog walking, babysitting, and knife sharpening. Each booking has one neighbor provider, users are not technical, and the platform keeps exactly 1% on top of Stripe processing fees. Recommend the Accounts v2 setup and implement the immediate-routing destination-charge formula.
context: |-
  If asked: the platform owns the customer relationship, pricing, refunds, disputes, and losses; providers are recipient-only and need Express Dashboard access; processing_fee_estimate is available in minor units using current regional pricing.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses Stripe embedded onboarding as the default onboarding flow.'
    requirement_level: MUST
  - value: 'MUST: Uses destination charges for a single-recipient booking whose proceeds should route immediately to that recipient.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard as express, fees_collector as application, and losses_collector as application.'
    requirement_level: MUST
  - value: 'MUST: Configures recipient capability at configuration.recipient.capabilities.stripe_balance.stripe_transfers for recipient-only connected accounts.'
    requirement_level: MUST
  - value: 'MUST NOT request Merchant configuration or card_payments for a recipient-only connected account.'
    requirement_level: MUST
  - value: 'MUST NOT require on_behalf_of for the destination charge.'
    requirement_level: MUST
  - value: 'MUST: Sets application_fee_amount to processing_fee_estimate + round(charge_amount * 0.01) in minor units.'
    requirement_level: MUST
  - value: 'MUST: States that platform net after Stripe processing fees is round(charge_amount * 0.01).'
    requirement_level: MUST
  - value: 'Does NOT set application_fee_amount to only 1% of the charge.'
    requirement_level: SHOULD
  - value: 'MUST: Distinguishes platform loss liability from fraud and risk-management controls.'
    requirement_level: MUST
  - value: 'Uses current Stripe pricing or the Platform Pricing Tool to determine processing_fee_estimate.'
    requirement_level: SHOULD
