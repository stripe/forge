id: stripe-integration-public-evals/sandbox-enable-connect-claude-stripe-plugin-cli
version: 0.1.0
task: |-
  Enable Connect in this Stripe Sandbox so I can create connected accounts. In this Stripe-plugin CLI environment, use the installed Stripe CLI tools plugin and perform the operation.
initial_prompt: |-
  Enable Connect in this Stripe Sandbox so I can create connected accounts. In this Stripe-plugin CLI environment, use the installed Stripe CLI tools plugin and perform the operation.
context: |-
  If asked: the Stripe plugin exposes the CLI tools enable_connect operation; enabled true is success whether state changed or was already enabled; MCP is intentionally unavailable in this treatment.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Invokes the Stripe CLI tools plugin''s enable_connect operation.'
    requirement_level: MUST
  - value: 'MUST NOT use MCP, curl, a direct API call, or explanation-only output.'
    requirement_level: MUST
  - value: 'MUST: Reports success only when the CLI result contains enabled: true.'
    requirement_level: MUST
  - value: 'MUST: Treats an already-enabled enabled: true result as idempotent success.'
    requirement_level: MUST
  - value: 'MUST: On success, states that Connect is enabled and connected accounts can now be created.'
    requirement_level: MUST
  - value: 'MUST: On an error or enabled: false, reports failure and does NOT state that Connect is enabled.'
    requirement_level: MUST
