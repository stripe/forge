id: stripe-integration-public-evals/high-margin-marketplace-15pct
version: 0.1.0
task: |-
  I'm building an online art marketplace like Etsy. Artists list work, buyers purchase through the platform, and the platform keeps a 15% commission on each sale. Artists need simple onboarding. Recommend the Accounts v2 setup and implement a single-artist destination-charge flow with the exact commission and fee economics.
initial_prompt: |-
  I'm building an online art marketplace like Etsy. Artists list work, buyers purchase through the platform, and the platform keeps a 15% commission on each sale. Artists need simple onboarding. Recommend the Accounts v2 setup and implement a single-artist destination-charge flow with the exact commission and fee economics.
context: |-
  If asked: each order has one artist and routes immediately; the platform is merchant of record and owns refunds, disputes, pricing, and losses; artists only receive transfers; the 15% is gross platform revenue before processing fees.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses Stripe embedded onboarding as the default onboarding flow.'
    requirement_level: MUST
  - value: 'MUST: Uses destination charges for a single-recipient booking whose proceeds should route immediately to that recipient.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard as express, fees_collector as application, and losses_collector as application.'
    requirement_level: MUST
  - value: 'MUST: Configures recipient capability at configuration.recipient.capabilities.stripe_balance.stripe_transfers for recipient-only connected accounts.'
    requirement_level: MUST
  - value: 'MUST NOT request Merchant configuration or card_payments for a recipient-only connected account.'
    requirement_level: MUST
  - value: 'MUST NOT require on_behalf_of for the destination charge.'
    requirement_level: MUST
  - value: 'MUST: Sets application_fee_amount to round(charge_amount * 0.15) in minor units.'
    requirement_level: MUST
  - value: 'MUST: Shows Stripe processing fees as a separate deduction when explaining platform net revenue.'
    requirement_level: MUST
  - value: 'Explains that a 15% gross commission generally has more fee headroom than low-single-digit commissions without guaranteeing profitability.'
    requirement_level: SHOULD
  - value: 'Links to current Stripe pricing or recommends verifying the net margin with the Platform Pricing Tool.'
    requirement_level: SHOULD
