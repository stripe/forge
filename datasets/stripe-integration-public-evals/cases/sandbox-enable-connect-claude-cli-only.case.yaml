id: stripe-integration-public-evals/sandbox-enable-connect-claude-cli-only
version: 0.1.0
task: |-
  Enable Connect in this Stripe Sandbox so I can create connected accounts. Use the installed Stripe CLI and its tools plugin; perform the operation rather than only describing it.
initial_prompt: |-
  Enable Connect in this Stripe Sandbox so I can create connected accounts. Use the installed Stripe CLI and its tools plugin; perform the operation rather than only describing it.
context: |-
  If asked: this evaluation environment exposes the Stripe CLI tools plugin; the command may return enabled true either because it enabled Connect now or because Connect was already enabled; no MCP tool should be used in this case.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Invokes the Stripe CLI tools plugin''s enable_connect operation.'
    requirement_level: MUST
  - value: 'MUST NOT substitute curl, a direct API call, or an explanation for the CLI tools-plugin operation.'
    requirement_level: MUST
  - value: 'MUST: Reports a newly successful enablement only when the operation returns enabled: true.'
    requirement_level: MUST
  - value: 'MUST: Treats enabled: true from an already-enabled sandbox as idempotent success.'
    requirement_level: MUST
  - value: 'MUST: On success, states that Connect is enabled and the sandbox can create connected accounts.'
    requirement_level: MUST
  - value: 'MUST: If the operation errors or returns enabled: false, reports failure and does NOT claim Connect is enabled.'
    requirement_level: MUST
