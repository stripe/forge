id: stripe-integration-public-evals/edge-on-top-of-fee-language
version: 0.1.0
task: |-
  I run a tutoring marketplace where tutors set their own rates. Use Express-style dashboard access under Accounts v2. I want my platform to net exactly 2% of each booking on top of Stripe processing fees. Recommend the configuration and show the destination-charge fee formula, with Stripe pricing treated as region-specific.
initial_prompt: |-
  I run a tutoring marketplace where tutors set their own rates. Use Express-style dashboard access under Accounts v2. I want my platform to net exactly 2% of each booking on top of Stripe processing fees. Recommend the configuration and show the destination-charge fee formula, with Stripe pricing treated as region-specific.
context: |-
  If asked: each booking has one tutor and routes immediately; the platform is merchant of record and owns refunds, disputes, pricing, and losses; tutors are recipient-only accounts; the processing-fee estimate is available as processing_fee_estimate in minor units.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses destination charges for a single-recipient booking whose proceeds should route immediately to that recipient.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard as express, fees_collector as application, and losses_collector as application.'
    requirement_level: MUST
  - value: 'MUST: Configures recipient capability at configuration.recipient.capabilities.stripe_balance.stripe_transfers for recipient-only connected accounts.'
    requirement_level: MUST
  - value: 'MUST NOT request Merchant configuration or card_payments for a recipient-only connected account.'
    requirement_level: MUST
  - value: 'MUST NOT require on_behalf_of for the destination charge.'
    requirement_level: MUST
  - value: 'MUST: Sets application_fee_amount to processing_fee_estimate + round(charge_amount * 0.02) in minor units.'
    requirement_level: MUST
  - value: 'MUST: States that platform net after Stripe processing fees is round(charge_amount * 0.02).'
    requirement_level: MUST
  - value: 'MUST NOT set application_fee_amount to only 2% of the charge.'
    requirement_level: MUST
  - value: 'Links to Stripe pricing or otherwise states that processing_fee_estimate must use the applicable regional rate.'
    requirement_level: SHOULD
