id: stripe-integration-public-evals/subscriptions-free-to-paid-flexible
version: 0.1.0
task: |-
  I'm upgrading users from a free Stripe subscription to a $30/month Pro plan. The upgrade should charge immediately only after the user confirms the preview, preserve a deliberate renewal anchor, and leave the user on Free if payment fails. Build the upgrade flow in Node.js/TypeScript using flexible billing mode.
initial_prompt: |-
  I'm upgrading users from a free Stripe subscription to a $30/month Pro plan. The upgrade should charge immediately only after the user confirms the preview, preserve a deliberate renewal anchor, and leave the user on Free if payment fails. Build the upgrade flow in Node.js/TypeScript using flexible billing mode.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Authorizes the user for the tenant and retrieves the tenant''s current subscription from server-side ownership data.'
    requirement_level: MUST
  - value: 'MUST: Updates the existing free subscription item by item ID instead of adding a second plan item.'
    requirement_level: MUST
  - value: 'MUST: Previews the upgrade with stripe.invoices.createPreview before requesting confirmation.'
    requirement_level: MUST
  - value: 'MUST: Uses the preview''s proration_date unchanged on the confirmed subscription update.'
    requirement_level: MUST
  - value: 'MUST: Sets billing_cycle_anchor explicitly to the intended renewal anchor.'
    requirement_level: MUST
  - value: 'MUST: Uses proration_behavior=''always_invoice'' for the requested immediate charge.'
    requirement_level: MUST
  - value: 'MUST: Uses payment_behavior=''pending_if_incomplete'' on an eligible charge_automatically subscription.'
    requirement_level: MUST
  - value: 'MUST NOT grant Pro access while subscription.pending_update is populated.'
    requirement_level: MUST
  - value: 'MUST: Grants Pro access only after the pending update is applied and a fresh subscription read shows the Pro Price.'
    requirement_level: MUST
  - value: 'MUST: Handles customer.subscription.pending_update_applied and customer.subscription.pending_update_expired idempotently.'
    requirement_level: MUST
  - value: 'MUST: Verifies webhook signatures and re-fetches current invoice and subscription state before changing access.'
    requirement_level: MUST
  - value: 'MUST NOT create a standalone PaymentIntent for the recurring upgrade.'
    requirement_level: MUST
