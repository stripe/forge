id: stripe-integration-public-evals/payments-fulfillment-replay-safety
version: 0.1.0
task: |-
  My shop sometimes sends two download licenses for one payment, and sometimes sends none if the buyer closes the tab. Fix the fulfillment flow.
initial_prompt: |-
  My shop sometimes sends two download licenses for one payment, and sometimes sends none if the buyer closes the tab. Fix the fulfillment flow.
context: |-
  We sell a $40 design pack with hosted Checkout and a Node/TypeScript backend. One paid order should issue one license and one delivery job. The success page currently issues the license, and a webhook can do it too. Our delivery worker retries jobs. We have a database and can stub the email sender.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Fulfill from verified server-side completed/paid state without requiring the buyer to load the success page.'
    requirement_level: MUST
  - value: 'MUST: Make the business effect idempotent by order or fulfillment identity across webhook and browser-triggered paths.'
    requirement_level: MUST
  - value: 'MUST: Preserve that invariant across concurrent execution and worker retries, not just repeated calls within one process.'
    requirement_level: MUST
  - value: 'MUST: Avoid regressing an already-paid/fulfilled order because an older event arrives later.'
    requirement_level: MUST
  - value: 'MUST: Preserve a recoverable delivery job if processing crashes after recording payment; marking an event handled before durably preserving its required work is insufficient.'
    requirement_level: MUST
  - value: 'Keep webhook response work short by durably accepting work before acknowledging it.'
    requirement_level: SHOULD
  - value: 'Record Stripe event and Session IDs for diagnosis in addition to the business-level fulfillment key.'
    requirement_level: SHOULD
  - value: 'MUST NOT expose a Stripe secret API key in browser/mobile code or expose a scoped client secret to anyone other than its intended customer.'
    requirement_level: MUST
  - value: 'MUST: If a webhook alters application state, verifies its signature using the unmodified request body and endpoint signing secret before processing.'
    requirement_level: MUST
