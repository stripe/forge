id: stripe-integration-public-evals/connect-ai-model-platform
version: 0.1.0
task: |-
  Using TypeScript and the stripe npm package, build the Connect integration for an AI-model platform where independent providers sell hosted inference APIs directly to enterprise developers. Providers are merchant of record and own refunds and tax obligations. Create and configure new provider accounts, embed onboarding and account management, accept direct inference payments, keep a 12% fee, and block live payment acceptance until onboarding is complete. Assume the app framework and Stripe client already exist.
initial_prompt: |-
  Using TypeScript and the stripe npm package, build the Connect integration for an AI-model platform where independent providers sell hosted inference APIs directly to enterprise developers. Providers are merchant of record and own refunds and tax obligations. Create and configure new provider accounts, embed onboarding and account management, accept direct inference payments, keep a 12% fee, and block live payment acceptance until onboarding is complete. Assume the app framework and Stripe client already exist.
context: |-
  If asked: this is greenfield; each inference purchase belongs to one provider; providers want Express Dashboard access plus in-product management; Stripe should own negative-balance liability; the 12% fee is taken from each direct charge.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard as express, fees_collector as stripe, and losses_collector as stripe.'
    requirement_level: MUST
  - value: 'MUST: Configures Merchant with card_payments for the connected business.'
    requirement_level: MUST
  - value: 'MUST: Creates customer payments as direct charges on the connected account.'
    requirement_level: MUST
  - value: 'MUST: Uses Stripe embedded onboarding as the default onboarding flow.'
    requirement_level: MUST
  - value: 'MUST: Gates live SaaS charges on configuration.merchant.capabilities.card_payments.status === ''active''.'
    requirement_level: MUST
  - value: 'MUST NOT use v1 charges_enabled or payouts_enabled as the Accounts v2 readiness check.'
    requirement_level: MUST
  - value: 'MUST: Collects exactly 12% of each inference payment with application_fee_amount computed from the charge amount in minor units.'
    requirement_level: MUST
  - value: 'MUST: Provides either embedded payment/payout management components or an Express Dashboard login link for providers.'
    requirement_level: MUST
  - value: 'If the recommended Express, Stripe-pricing, Stripe-owned-losses configuration is not GA at evaluation time, the response MUST disclose its preview status and use the currently required preview API version.'
    requirement_level: MUST
