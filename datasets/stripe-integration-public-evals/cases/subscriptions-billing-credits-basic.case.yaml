id: stripe-integration-public-evals/subscriptions-billing-credits-basic
version: 0.1.0
task: |-
  I'm maintaining a Billing Meters subscription and want to grant a customer $100 of promotional billing credits that apply only to selected metered Prices. Show the available balance, expiration, expected invoice effect, and what happens after voids or credit notes. Build the integration in Node.js/TypeScript.
initial_prompt: |-
  I'm maintaining a Billing Meters subscription and want to grant a customer $100 of promotional billing credits that apply only to selected metered Prices. Show the available balance, expiration, expected invoice effect, and what happens after voids or credit notes. Build the integration in Node.js/TypeScript.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Creates the $100 Credit Grant with explicit effective and expiration timestamps.'
    requirement_level: MUST
  - value: 'MUST: Scopes the Credit Grant applicability to the selected metered Price IDs.'
    requirement_level: MUST
  - value: 'MUST: Uses Billing Meters for every credited usage item.'
    requirement_level: MUST
  - value: 'MUST NOT apply the Credit Grant to licensed Prices.'
    requirement_level: MUST
  - value: 'MUST: Reads Stripe''s authoritative credit balance summary for the Customer.'
    requirement_level: MUST
  - value: 'MUST: Shows the grant expiration from Stripe state rather than a client-supplied date.'
    requirement_level: MUST
  - value: 'MUST: Labels invoice previews and draft invoices as provisional because credits are committed at finalization.'
    requirement_level: MUST
  - value: 'MUST: Verifies the applied credit amount on the finalized invoice.'
    requirement_level: MUST
  - value: 'MUST NOT claim that a credit note restores consumed Billing Credits.'
    requirement_level: MUST
  - value: 'MUST: Reconciles the restored credit balance after an eligible invoice void instead of assuming the result locally.'
    requirement_level: MUST
  - value: 'MUST: Authorizes Customer access before returning balances, grants, or invoice effects.'
    requirement_level: MUST
  - value: 'MUST: Uses stable idempotency keys for grant creation and verifies and durably deduplicates credit, meter, invoice, and payment webhooks.'
    requirement_level: MUST
