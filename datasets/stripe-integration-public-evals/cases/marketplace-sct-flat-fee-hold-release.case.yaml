id: stripe-integration-public-evals/marketplace-sct-flat-fee-hold-release
version: 0.1.0
task: |-
  Build Connect for a home-repair marketplace where homeowners pay a deposit after accepting a contractor bid and the contractor's funds are released only after job completion. The platform keeps a flat $35 per completed job. Use Accounts v2, show the charge and later transfer flow, and make the fee math explicit.
initial_prompt: |-
  Build Connect for a home-repair marketplace where homeowners pay a deposit after accepting a contractor bid and the contractor's funds are released only after job completion. The platform keeps a flat $35 per completed job. Use Accounts v2, show the charge and later transfer flow, and make the fee math explicit.
context: |-
  If asked: the platform is merchant of record and owns losses; contractors are recipient-only sole proprietors with Express Dashboard access; the contractor is intended to absorb Stripe processing fees; contractor transfer = collected charge minus actual Stripe processing fee minus $35; final release is triggered by verified job completion.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses Stripe embedded onboarding as the default onboarding flow.'
    requirement_level: MUST
  - value: 'MUST: Uses separate charges and transfers so collection and contractor settlement occur at different times.'
    requirement_level: MUST
  - value: 'MUST NOT use destination charges for the hold/release flow.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard express, fees_collector application, losses_collector application, and Recipient stripe_balance.stripe_transfers.'
    requirement_level: MUST
  - value: 'MUST: Creates the contractor Transfer only after verified job-completion authorization.'
    requirement_level: MUST
  - value: 'MUST: Sets transfer amount to charge_amount - actual_stripe_processing_fee - 3500 for USD.'
    requirement_level: MUST
  - value: 'MUST NOT set application_fee_amount on the Transfer.'
    requirement_level: MUST
  - value: 'MUST NOT recommend the Platform Pricing Tool for the separate-charges-and-transfers fee.'
    requirement_level: MUST
  - value: 'Warns that $35 may not cover platform costs on large jobs and recommends evaluating percentage or blended pricing.'
    requirement_level: SHOULD
  - value: 'MUST: Gates release on configuration.recipient.capabilities.stripe_balance.stripe_transfers.status === ''active''.'
    requirement_level: MUST
