id: stripe-integration-public-evals/incompatibility-dashboard-none-scope
version: 0.1.0
task: |-
  IMPORTANT: Non-interactive mode. Build the architecture for a fully white-labeled payment platform whose business clients must never see Stripe branding. I explicitly require dashboard none and custom onboarding, payment views, refunds, disputes, and remediation. The platform takes 12% on single-recipient destination charges. Provide the Accounts v2 configuration and implementation plan while clearly stating the operational burden.
initial_prompt: |-
  IMPORTANT: Non-interactive mode. Build the architecture for a fully white-labeled payment platform whose business clients must never see Stripe branding. I explicitly require dashboard none and custom onboarding, payment views, refunds, disputes, and remediation. The platform takes 12% on single-recipient destination charges. Provide the Accounts v2 configuration and implementation plan while clearly stating the operational burden.
context: |-
  If asked: the company knowingly accepts ownership of KYC data collection, requirements remediation, refunds, disputes, and ongoing account-support surfaces; it has an explicit contractual white-label requirement; each charge has one destination; the platform owns pricing and losses.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard none, fees_collector application, and losses_collector application.'
    requirement_level: MUST
  - value: 'MUST: Uses destination charges for the stated single-recipient flow.'
    requirement_level: MUST
  - value: 'MUST: Sets application_fee_amount to round(charge_amount * 0.12) in minor units.'
    requirement_level: MUST
  - value: 'MUST: States that dashboard none makes the platform responsible for KYC collection and onboarding edge cases.'
    requirement_level: MUST
  - value: 'MUST: States that the platform must build and maintain refunds and disputes surfaces.'
    requirement_level: MUST
  - value: 'MUST: States that the platform must surface ongoing requirements and remediation.'
    requirement_level: MUST
  - value: 'MUST NOT substitute Express or full Dashboard access for the explicit dashboard-none requirement.'
    requirement_level: MUST
