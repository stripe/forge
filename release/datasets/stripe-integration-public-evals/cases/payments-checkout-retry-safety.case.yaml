id: stripe-integration-public-evals/payments-checkout-retry-safety
version: 0.2.0
task: |-
  Customers on slow connections sometimes click Pay twice. Make checkout safe to retry without creating two payable purchases for the same order.
initial_prompt: |-
  Customers on slow connections sometimes click Pay twice. Make checkout safe to retry without creating two payable purchases for the same order.
context: |-
  We sell $80 workshop tickets through hosted Checkout in a Node/TypeScript app. The order already exists before payment starts. Requests can reach different server workers, and sometimes the response disappears after Stripe received it. Reopening an unpaid order should resume its active checkout. If that checkout genuinely expires, the customer should be able to start again.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Enforce a durable per-order purchase invariant under concurrent requests; disabling a button alone is insufficient.'
    requirement_level: MUST
  - value: 'Reuse a persisted idempotency key when retrying the same Session-creation operation with the same parameters; equivalent recovery that avoids resending the mutation is valid.'
    requirement_level: SHOULD
  - value: 'MUST: Reuse an existing open Session for the same unchanged payment attempt instead of creating another payable Session.'
    requirement_level: MUST
  - value: 'MUST: Reconcile an ambiguous result or completed Session before deciding a new payment attempt is necessary.'
    requirement_level: MUST
  - value: 'MUST: Permit a deliberately new attempt after confirmed expiration while preserving the original order and preventing duplicate fulfillment; if using idempotency keys, use a new key for that new creation operation.'
    requirement_level: MUST
  - value: 'MUST NOT treat Stripe''s idempotency cache as a permanent business-level uniqueness constraint.'
    requirement_level: MUST
  - value: 'Show a recoverable pending/retry state rather than an unexplained generic failure after a timeout.'
    requirement_level: SHOULD
  - value: 'MUST NOT expose a Stripe secret API key in browser/mobile code or expose a scoped client secret to anyone other than its intended customer.'
    requirement_level: MUST
  - value: 'MUST: If a webhook alters application state, verifies its signature using the unmodified request body and endpoint signing secret before processing. his signature criterion passes when no webhook handler exists.'
    requirement_level: MUST
