id: stripe-integration-public-evals/saas-self-serve-platform-managed-pricing
version: 1.0.0
task: |-
  Build Connect for a self-serve SaaS product where independent bookkeepers create invoicing pages and accept payments from their own clients. Bookkeepers onboard without sales help using Stripe embedded onboarding and need a lightweight experience. The platform wants to control transaction pricing through Stripe's platform-pricing tooling because it has negotiated rates, but it will not accept negative-balance liability. Provide the exact Accounts v2 configuration, direct-charge flow, onboarding, readiness check, and availability caveats.
initial_prompt: |-
  Build Connect for a self-serve SaaS product where independent bookkeepers create invoicing pages and accept payments from their own clients. Bookkeepers onboard without sales help using Stripe embedded onboarding and need a lightweight experience. The platform wants to control transaction pricing through Stripe's platform-pricing tooling because it has negotiated rates, but it will not accept negative-balance liability. Provide the exact Accounts v2 configuration, direct-charge flow, onboarding, readiness check, and availability caveats.
context: |-
  If asked: this is for newly created accounts only; bookkeepers are merchant of record; use Express Dashboard access; Stripe should own negative balances; platform pricing rules, not per-charge application fees, determine the platform margin; evaluate feature GA/preview status at response time.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'MUST: Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: MUST
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses Stripe embedded onboarding as the default onboarding flow.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard express, fees_collector application, and losses_collector stripe.'
    requirement_level: MUST
  - value: 'MUST: Configures Merchant with card_payments and uses direct charges on the bookkeeper account.'
    requirement_level: MUST
  - value: 'MUST: Uses the Platform Pricing Tool to define platform-owned pricing rules.'
    requirement_level: MUST
  - value: 'MUST NOT set application_fee_amount in addition to Platform Pricing Tool rules.'
    requirement_level: MUST
  - value: 'MUST: Gates live charges on configuration.merchant.capabilities.card_payments.status === ''active''.'
    requirement_level: MUST
  - value: 'MUST: States that this Managed Risk configuration applies to newly created accounts and does not claim existing accounts can flip in place.'
    requirement_level: MUST
  - value: 'MUST: If the configuration is not GA at evaluation time, discloses public-preview status and uses the currently required preview API version.'
    requirement_level: MUST
  - value: 'MUST NOT hardcode a launch date or obsolete preview API version.'
    requirement_level: MUST
  - value: 'Recommends Radar for Platforms or equivalent fraud controls separately from losses_collector.'
    requirement_level: SHOULD
