id: stripe-integration-public-evals/edge-inclusive-fee-language
version: 1.0.0
task: |-
  I run a photography marketplace where photographers sell prints. My total platform take is calculated as 10% of the customer charge, rounded to the nearest minor currency unit when the result is fractional.

  It should be inclusive of Stripe processing fees: Stripe fees come out of that 10%, not on top of it. Recommend the Accounts v2 configuration and implement the single-photographer payment and fee calculation.
initial_prompt: |-
  I run a photography marketplace where photographers sell prints. My total platform take is calculated as 10% of the customer charge, rounded to the nearest minor currency unit when the result is fractional.

  It should be inclusive of Stripe processing fees: Stripe fees come out of that 10%, not on top of it. Recommend the Accounts v2 configuration and implement the single-photographer payment and fee calculation.
context: |-
  If asked: each order has one photographer and routes immediately; the platform is merchant of record and owns disputes, refunds, pricing, and negative balances; photographers only receive transfers and want Express Dashboard access.
execution_mode: multi_turn
max_turns: 10
setup: []
judging_criteria:
  - value: 'Uses Accounts v2 account creation and configuration for every new connected account.'
    requirement_level: SHOULD
  - value: 'MUST NOT create an account with the legacy type parameter set to express, standard, or custom.'
    requirement_level: MUST
  - value: 'MUST: Uses destination charges for a single-recipient booking whose proceeds should route immediately to that recipient.'
    requirement_level: MUST
  - value: 'MUST: Configures dashboard as express'
    requirement_level: MUST
  - value: 'MUST: Configures fees_collector as application'
    requirement_level: MUST
  - value: 'MUST: Configures losses_collector as application.'
    requirement_level: MUST
  - value: 'MUST: Configures recipient capability at configuration.recipient.capabilities.stripe_balance.stripe_transfers for recipient-only connected accounts.'
    requirement_level: MUST
  - value: 'MUST NOT request Merchant configuration or card_payments for a recipient-only connected account.'
    requirement_level: MUST
  - value: 'MUST NOT require on_behalf_of for the destination charge.'
    requirement_level: MUST
  - value: 'MUST: Sets application_fee_amount to round(charge_amount * 0.10) in minor units.'
    requirement_level: MUST
  - value: 'MUST: States that platform net equals application_fee_amount minus Stripe processing fees.'
    requirement_level: MUST
  - value: 'MUST NOT add estimated Stripe processing fees to application_fee_amount.'
    requirement_level: MUST
