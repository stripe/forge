name: Publish development snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-development-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @stripe/forge development snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@stripe'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set snapshot version
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version")"
          SNAPSHOT_VERSION="$(node scripts/snapshot-version.mjs "${BASE_VERSION}" "${GITHUB_RUN_NUMBER}")"
          npm version "${SNAPSHOT_VERSION}" --no-git-tag-version

      - name: Check package
        run: pnpm check

      - name: Publish snapshot
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
