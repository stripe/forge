name: Publish development snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @stripe/forge development snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@stripe'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package
        run: pnpm check

      - name: Set snapshot version
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version")"
          case "${BASE_VERSION}" in
            *-dev.0) ;;
            *)
              echo "Expected package version to end in -dev.0, found ${BASE_VERSION}" >&2
              exit 1
              ;;
          esac
          npm version "${BASE_VERSION%.0}.${GITHUB_RUN_NUMBER}" --no-git-tag-version

      - name: Publish snapshot
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
